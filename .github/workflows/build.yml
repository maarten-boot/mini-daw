# Build and test on Windows (primary target) and Linux.
# Every action is pinned to a full commit SHA; the comment gives the release tag.
# tools/check_licenses.py fails if an action is not pinned this way.

name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache fetched dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/*-src
          key: deps-windows-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke-run the program
        run: |
          build\src\Release\mini-daw.exe --version
          build\src\Release\mini-daw.exe --list-devices

      - name: Upload program
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mini-daw-windows-x64
          path: build/src/Release/mini-daw.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libasound2-dev libpulse-dev xorg-dev libgl-dev

      - name: Cache fetched dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/*-src
          key: deps-linux-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  licence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Licence and pinning checks
        run: python3 -I tools/check_licenses.py
