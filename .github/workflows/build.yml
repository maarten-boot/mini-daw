# Build and test on Windows (primary target) and Linux.
# Every action is pinned to a full commit SHA; the comment gives the release tag.
# tools/check_licenses.py fails if an action is not pinned this way.

name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache fetched dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/*-src
          key: deps-windows-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Install NSIS (installer, P9b)
        # Pinned version (crosscheck #8, O2); the runner image has no NSIS.
        run: |
          choco install nsis --version=3.13.0 -y --no-progress --allow-downgrade
          $v = & "C:\Program Files (x86)\NSIS\makensis.exe" -VERSION
          Write-Output "makensis $v"
          if ($v -ne "v3.13") { throw "unexpected NSIS version $v" }

      - name: Configure
        # No -G: CMake picks the newest Visual Studio on the runner image.
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        # Per-test limit: a hang fails in minutes and shows in the log.
        run: ctest --test-dir build -C Release --output-on-failure --timeout 300

      - name: Check the programs (window/console, icon, version info)
        run: python tools/check_pe.py build\src\Release

      - name: Smoke-run the program
        # mini-daw.com is the console version: output and exit codes.
        run: |
          build\src\Release\mini-daw.com --version
          build\src\Release\mini-daw.com --list-devices

      - name: Build the installer
        run: cmake --build build --config Release --target installer

      - name: Collect the downloads
        # One flat folder: the download holds the three files side by side (O1).
        run: |
          New-Item -ItemType Directory -Force upload | Out-Null
          Copy-Item build\src\Release\mini-daw.exe, build\src\Release\mini-daw.com, build\mini-daw-*-setup.exe upload\
          Get-ChildItem upload

      - name: Upload program
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mini-daw-windows-x64
          path: upload/
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libasound2-dev libpulse-dev xorg-dev libgl-dev

      - name: Cache fetched dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/*-src
          key: deps-linux-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

      - name: Smoke-run the program
        run: |
          ./build/src/mini-daw --version
          ./build/src/mini-daw --list-devices

      - name: Upload program
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mini-daw-linux-x64
          path: build/src/mini-daw
          if-no-files-found: error

  licence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Licence and pinning checks
        run: python3 -I tools/check_licenses.py
