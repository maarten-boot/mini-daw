# Build and test on Windows (primary target) and Linux.
# Every action is pinned to a full commit SHA; the comment gives the release tag.
# tools/check_licenses.py fails if an action is not pinned this way.
# A pushed tag v<x.y.z>[-rc<n>] also makes a draft GitHub release (P33, job
# "release"); the tag must match the CMake version, see tools/release_notes.py.

name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache fetched dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/*-src
          key: deps-windows-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Install NSIS (installer, P9b)
        # Pinned version (crosscheck #8, O2); the runner image has no NSIS.
        # Up to 3 tries a minute apart: the Chocolatey feed sometimes answers
        # 504 Gateway Timeout (run 44339405990).
        run: |
          for ($try = 1; $try -le 3; $try++) {
            choco install nsis --version=3.13.0 -y --no-progress --allow-downgrade
            if ($LASTEXITCODE -eq 0) { break }
            if ($try -eq 3) { throw "NSIS could not be installed (3 tries)" }
            Write-Output "choco failed (exit $LASTEXITCODE), try $($try + 1) of 3 in 60 s"
            Start-Sleep -Seconds 60
          }
          $v = & "C:\Program Files (x86)\NSIS\makensis.exe" -VERSION
          Write-Output "makensis $v"
          if ($v -ne "v3.13") { throw "unexpected NSIS version $v" }

      - name: Configure
        # No -G: CMake picks the newest Visual Studio on the runner image.
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        # Per-test limit: a hang fails in minutes and shows in the log.
        run: ctest --test-dir build -C Release --output-on-failure --timeout 300

      - name: Check the programs (window/console, icon, version info)
        run: python tools/check_pe.py build\src\Release

      - name: Smoke-run the program
        # mini-daw.com is the console version: output and exit codes.
        run: |
          build\src\Release\mini-daw.com --version
          build\src\Release\mini-daw.com --list-devices

      - name: Build the installer
        run: cmake --build build --config Release --target installer

      - name: Collect the downloads
        # One flat folder: the download holds the three files side by side (O1).
        run: |
          New-Item -ItemType Directory -Force upload | Out-Null
          Copy-Item build\src\Release\mini-daw.exe, build\src\Release\mini-daw.com, build\mini-daw-*-setup.exe upload\
          Get-ChildItem upload

      - name: Upload program
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mini-daw-windows-x64
          path: upload/
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libasound2-dev libpulse-dev xorg-dev libgl-dev xvfb \
            libxml2-utils

      - name: Cache fetched dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/*-src
          key: deps-linux-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        # On a virtual X11 display, so the plugin editor test in an X11 window runs too (P24, T-VST-39).
        run: xvfb-run -a ctest --test-dir build --output-on-failure --timeout 300

      - name: Smoke-run the program
        run: |
          ./build/src/mini-daw --version
          ./build/src/mini-daw --list-devices

      - name: Upload program
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mini-daw-linux-x64
          path: build/src/mini-daw
          if-no-files-found: error

  macos:
    # P34 (SPEC-TECH-07): macOS is a preview until it has been tried on a Mac.
    # A failure here shows in the run but does not fail it; the release takes
    # the .dmg when this job made one (P34e decides whether that changes).
    # One program for Apple silicon and Intel (P34d); the tests run as arm64.
    runs-on: macos-15
    continue-on-error: true
    # The release waits for this job (to take its .dmg): a hung test or
    # hdiutil must not hold a release up for hours (crosscheck #28 CC1).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache fetched dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/*-src
          key: deps-macos-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        # Make with a bare -j starts every job at once: the first run took
        # 50 minutes on the 3-core runner. One job per core. -k: go on after
        # an error, so one run shows every file that does not compile yet.
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)" -- -k

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

      - name: Smoke-run the program
        run: |
          ./build/src/mini-daw.app/Contents/MacOS/mini-daw --version
          ./build/src/mini-daw.app/Contents/MacOS/mini-daw --list-devices

      - name: Check both architectures
        run: |
          archs="$(lipo -archs build/src/mini-daw.app/Contents/MacOS/mini-daw)"
          echo "mini-daw: $archs"
          case " $archs " in *" arm64 "*) ;; *) echo "arm64 missing"; exit 1 ;; esac
          case " $archs " in *" x86_64 "*) ;; *) echo "x86_64 missing"; exit 1 ;; esac

      - name: Check the built-in Info.plist
        # The microphone usage text (macOS ends a program that asks to record
        # without one) and the version (P34b).
        run: |
          python3 - <<'PY'
          import plistlib, re, sys
          app = "build/src/mini-daw.app/Contents/"
          data = open(app + "MacOS/mini-daw", "rb").read()
          found = re.search(rb"<plist version.*?</plist>", data, re.S)
          if not found:
              sys.exit("no Info.plist in the program")
          for name, info in (("built in", plistlib.loads(found.group(0))),
                             ("Info.plist", plistlib.load(open(app + "Info.plist", "rb")))):
              print(name + ":", info["CFBundleIdentifier"], info["CFBundleShortVersionString"],
                    "icon:", info["CFBundleIconFile"])
              print("  NSMicrophoneUsageDescription:", info["NSMicrophoneUsageDescription"])
          PY
          test -s build/src/mini-daw.app/Contents/Resources/mini-daw.icns

      - name: Make the .dmg
        # Unsigned (no Apple developer account): an ad-hoc signature over the
        # whole .app, so macOS sees it as one unchanged program and offers
        # "Open Anyway" (README, Installing).
        run: |
          set -euo pipefail
          v="$(plutil -extract CFBundleShortVersionString raw build/src/mini-daw.app/Contents/Info.plist)"
          codesign --force --deep --sign - build/src/mini-daw.app
          codesign --verify --deep --strict --verbose=2 build/src/mini-daw.app
          stage="$RUNNER_TEMP/dmg"
          rm -rf "$stage" && mkdir -p "$stage"
          cp -R build/src/mini-daw.app "$stage/"
          ln -s /Applications "$stage/Applications"
          cp LICENSE THIRD_PARTY.md README.md CHANGELOG.md "$stage/"
          mkdir -p out
          hdiutil create -volname "mini-daw $v" -srcfolder "$stage" -fs HFS+ -format UDZO -ov "out/mini-daw-$v-macos.dmg"
          hdiutil verify "out/mini-daw-$v-macos.dmg"
          ls -l out

      - name: Upload program
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mini-daw-macos
          path: out/mini-daw-*-macos.dmg
          if-no-files-found: warn

  licence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Licence and pinning checks
        run: python3 -I tools/check_licenses.py

      - name: Tag, version and release notes (release, P33)
        # Early, so a wrong tag fails before the long builds are waited for.
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 -I tools/release_notes.py "$GITHUB_REF_NAME"

  release:
    # Only for a pushed tag, after the Windows and Linux builds and their tests
    # passed. macOS is a preview (P34): its .dmg goes along when that job made
    # one, and the release does not wait for it to succeed.
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v')
          && needs.windows.result == 'success' && needs.linux.result == 'success'
          && needs.licence.result == 'success' }}
    needs: [windows, linux, licence, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # creating the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the builds of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Release notes
        run: |
          set -euo pipefail
          mac=()
          if compgen -G "artifacts/mini-daw-macos/*.dmg" > /dev/null; then mac=(--macos); fi
          python3 -I tools/release_notes.py "${mac[@]}" "$GITHUB_REF_NAME" > notes.md

      - name: Package
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          mkdir -p out
          # Windows: the installer, and a zip to run without installing.
          cp artifacts/mini-daw-windows-x64/mini-daw-*-setup.exe "out/mini-daw-$v-windows-x64-setup.exe"
          w="mini-daw-$v-windows-x64"
          mkdir -p "$w"
          cp artifacts/mini-daw-windows-x64/mini-daw.exe artifacts/mini-daw-windows-x64/mini-daw.com \
             LICENSE THIRD_PARTY.md README.md CHANGELOG.md "$w/"
          zip -r -q "out/$w.zip" "$w"
          # Linux: the program (the download loses its x bit) with the same texts.
          l="mini-daw-$v-linux-x64"
          mkdir -p "$l"
          cp artifacts/mini-daw-linux-x64/mini-daw LICENSE THIRD_PARTY.md README.md CHANGELOG.md "$l/"
          chmod 755 "$l/mini-daw"
          tar -czf "out/$l.tar.gz" --owner=0 --group=0 "$l"
          # macOS (P34d, a preview): the .dmg, when the macOS job made one.
          for d in artifacts/mini-daw-macos/*.dmg; do
            if [ -f "$d" ]; then cp "$d" "out/mini-daw-$v-macos.dmg"; fi
          done
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -l out
          cat out/SHA256SUMS.txt

      - name: Create the draft release
        # A draft: the user checks it and publishes it on GitHub. A -rc tag is
        # marked as a pre-release. Re-running fails if the draft is already
        # there: delete that draft first.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          pre=()
          case "$v" in *-rc*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" out/* --draft --verify-tag \
            --title "mini-daw $v" --notes-file notes.md "${pre[@]}"
